# Tooling configuration only -- this project is a set of scripts, not an
# installable Python package (see packaging/ for the .deb and PKGBUILD).
#
# Lint with:        ruff check .
# Type-check with:  mypy *.py
# Test with:        python3 -m unittest discover -s tests -t .

[tool.ruff]
line-length = 79
# Matches the "python3 (>= 3.8)" dependency in packaging/debian/build.sh.
target-version = "py38"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: PEP 8 errors and warnings
    "F",        # pyflakes: unused/undefined names
    "N",        # pep8-naming
    "D",        # pydocstyle: PEP 257 docstrings
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "BLE",      # flake8-blind-except: every broad `except Exception` needs
                # a `# noqa: BLE001` and a comment saying why
    "RUF100",   # flag `noqa` comments that no longer suppress anything
    "S",        # flake8-bandit: security
]
ignore = [
    # We run desktop tools (xrandr, xprop, xfconf-query, dbus-send, ...) by
    # bare name because they live in different places on every distro. Every
    # call passes an argument list, never a shell, so no argument can be
    # reinterpreted as a command.
    "S603", "S607",
    # `random` only picks which photo to show; nothing here needs to be
    # unpredictable to an attacker.
    "S311",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test methods are named for what they check; docstrings on each add noise.
# Tests use assert, and their tokens/keys are made-up constants.
"tests/*" = ["D1", "S101", "S105", "S106"]

[tool.mypy]
# The packaged minimum is Python 3.8, but mypy itself needs 3.10+ as its
# target. Every module uses `from __future__ import annotations`, so the
# type hints mean the same thing on 3.8.
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
